spring:
  application:
    name: white-order-service
  discovery: # Eureka client configuration to register with Eureka server
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka
  datasource: # Database connection details
    url: jdbc:mysql://localhost:3306/white_order_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa: # JPA/Hibernate configuration
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8081
#config: # Config Server URL to fetch this configuration
#    import: optional:configserver:http://localhost:8888
