spring:
  application:
    name: white-order-service
  server:
    port: 8081

  # Config Server URL to fetch this configuration
  config:
    import: optional:configserver:http://localhost:8888

  # Eureka client configuration to register with Eureka server
  discovery:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka

  # Database connection details
  datasource:
    url: jdbc:mysql://localhost:3306/white_order_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA/Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
